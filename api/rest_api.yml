openapi: 3.0.0

tags:
  - name: Post

info:
  title: TripSocialNetwork API
  description: Current API describes interaction with TripSocialNetwork
  version: 1.0.0

paths:
  /post:
    post:
      summary: Create post
      description: Method creates post
      tags:
        - Post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: post text
                img_urls:
                  type: 
              required:
                - text
            examples:
              request:
                value:
                  text: "some information"
