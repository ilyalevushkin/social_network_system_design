          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: id of the tiny url
                  tiny_url:
                    type: string
                    description: tiny url for long url
                required:
                  - id
                  - tiny_url
              examples:
